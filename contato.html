
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Estética | Contato</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #fff8fb;
            color: #59434c;
        }

        header {
            background: white;
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px #ead6df;
        }

        .logo {
            color: #c66b8b;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #59434c;
        }

        nav a:hover, nav a.ativo {
            color: #cc7895;
            font-weight: bold;
        }

        .contato {
            padding: 70px 20px;
            text-align: center;
        }

        h1 {
            color: #b45e7d;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .contato p {
            margin: 15px 0;
            line-height: 1.8;
        }

        .formulario {
            max-width: 500px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ead6df;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #a94f72;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #e7c4d1;
            border-radius: 8px;
            font-family: Arial, sans-serif;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        button {
            background: #cc7895;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #a94f72;
        }

        footer {
            background: #b45e7d;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 20px; }
            nav ul { flex-wrap: wrap; justify-content: center; gap: 15px; }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">BELLA ESTÉTICA</div>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="servicos.html">Serviços</a></li>
            <li><a href="sobre.html">Sobre nós</a></li>
            <li><a href="diferenciais.html">Diferenciais</a></li>
            <li><a href="contato.html" class="ativo">Contato</a></li>
        </ul>
    </nav>
</header>

<main class="contato">

    <h1>Entre em Contato</h1>

    <p>
        Será um prazer atender você!
    </p>

    <p>
        Entre em contato para tirar dúvidas
        e agendar seu horário.
    </p>

    <div class="formulario">

        <form action="#" method="post">

            <label for="nome">Nome completo:</label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required>

            <label for="email">E-mail:</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required>

            <label for="telefone">Telefone:</label>

            <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="Digite seu telefone">

            <label for="mensagem">Mensagem:</label>

            <textarea
                id="mensagem"
                name="mensagem"
                placeholder="Escreva sua mensagem"
                required></textarea>

            <button type="submit">
                Enviar mensagem
            </button>

        </form>

    </div>

</main>

<footer>
    <p>© 2026 Bella Estética - Todos os direitos reservados.</p>
</footer>

</body>
</html>
